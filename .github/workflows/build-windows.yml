name: Build Windows package

# 本机零安装方案：把文件放到你 fork 的 .github/workflows/build-windows.yml
# 然后在 Actions 页手动触发 Run workflow 即可出 Windows 包。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            args: ''
          - edition: zhenguojian
            args: '--all-sources'

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 准备 Go（版本从 native/go.mod 读取）
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: 准备 Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # 官方 CI 里 windows 任务缺少这一步（且被 if:false 关闭），这里补回来。
      # build_native.py 只认 x86_64-w64-mingw32-gcc，用它把 native/ 编成 duanju_core.dll。
      - name: 准备 MinGW-w64（编译 Go 核心 DLL）
        shell: pwsh
        run: |
          $dirs = @(
            'C:\msys64\mingw64\bin',
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\ProgramData\mingw64\mingw32\bin',
            'C:\tools\mingw64\bin',
            'C:\ProgramData\chocolatey\bin'
          )

          function Get-MingwDir($candidates) {
            foreach ($d in $candidates) {
              if (Test-Path (Join-Path $d 'x86_64-w64-mingw32-gcc.exe')) { return $d }
            }
            return $null
          }

          $hit = Get-MingwDir $dirs
          if (-not $hit) {
            Write-Host '镜像内未找到 MinGW-w64，改用 Chocolatey 安装…'
            # 注意：choco 的 mingw 包不生成 shim，安装后必须重新扫描定位真实 bin 目录
            choco install mingw -y --no-progress
            $hit = Get-MingwDir $dirs
          }
          if (-not $hit) { throw '安装后仍找不到 x86_64-w64-mingw32-gcc.exe' }

          Write-Host "MinGW-w64 目录: $hit"
          $hit | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $hit 'x86_64-w64-mingw32-gcc.exe') --version | Select-Object -First 1

      - name: 构建 Windows 包
        shell: pwsh
        env:
          GOPROXY: https://goproxy.cn,direct
          GOSUMDB: off
        run: python scripts/build_windows.py ${{ matrix.args }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 30
